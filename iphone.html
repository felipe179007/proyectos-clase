<!doctype html>
<html lang="en">
  <head>
    <title>Apple iPhone</title>
    <link rel="stylesheet" href="style-iphone.css" />
  </head>
  <body>
    <header>
      <div class="logo-container">
        <img src="apple-white.png" alt="Apple logo" class="apple-logo" />
      </div>

      <div class="navbar">
        <a href="https://www.apple.com/la/iphone/">iPhone</a>
        <a href="https://www.apple.com/la/mac/">Mac</a>
        <a href="https://www.apple.com/la/ipad/">iPad</a>
        <a href="https://www.apple.com/la/support/">Soporte</a>
      </div>
    </header>

    <main>
      <div class="hero-div">
        <p class="hero-small-slogan-iphone-17-pro">Titanio. Potencia. Precisión.</p>
        <h1 class="hero-title-iphone-17-pro"><b>iPhone 17 <br> PRO</b></h1>
        <img src="iphone-17-pro-dark-blue.jpg" alt="iphone-17-pro-dark-blue" class="hero-img-iphone-17-pro">
      </div>
    </main>
  </body>
</html>
